server:
  port: 8085

spring:
  application:
    name: taskpulse-test
  datasource:
    url: jdbc:h2:mem:taskpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

taskpulse:
  node-id: "test-node"
  scheduler:
    poll-interval-ms: 1000
  workers:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
